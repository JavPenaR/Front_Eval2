name: Deploy Frontend Innovatech
on:
  push:
    branches: [ deploy ] # Solo se activa cuando subes algo a la rama deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Subir Imagen a Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/innovatech-front:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/innovatech-front:latest

      - name: Desplegar en AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Bajar la versión nueva de la imagen
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/innovatech-front:latest
            # Detener y borrar el contenedor viejo si existe
            sudo docker stop front-app || true
            sudo docker rm front-app || true
            # Correr el contenedor nuevo entregándole la IP del Backend entre comillas
            sudo docker run -d --name front-app -p 80:5000 -e BACKEND_URL="http://10.0.2.173:3000" ${{ secrets.DOCKER_USERNAME }}/innovatech-front:latest