name: Front Build, Push and Trigger Back

on:
  push:
    branches:
      - main

jobs:
  build-front-and-notify-back:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del frontend
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:${{ github.sha }}

      - name: Avisar al repositorio backend
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BACK_REPO_ACCESS_TOKEN }}
          repository: JavPenaR/Back-EVAL2
          event-type: front-actualizado
          client-payload: |
            {
              "front_repo": "${{ github.repository }}",
              "front_commit": "${{ github.sha }}",
              "front_branch": "${{ github.ref_name }}",
              "front_image": "${{ secrets.DOCKERHUB_USERNAME }}/frontend-service:${{ github.sha }}"
            }